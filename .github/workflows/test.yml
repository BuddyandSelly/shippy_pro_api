name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  rspec:
    name: rspec
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # The suite fails when line or branch coverage drops below 100%,
      # see spec/spec_helper.rb.
      - name: Run rspec
        run: bundle exec rspec --format documentation

      - name: Read coverage
        id: coverage
        if: always()
        run: |
          ruby -rjson -e '
            result = JSON.parse(File.read("coverage/.last_run.json"))["result"]
            File.open(ENV["GITHUB_OUTPUT"], "a") do |out|
              out.puts "line=#{result["line"]}"
              out.puts "branch=#{result["branch"]}"
            end
          '

      - name: Add coverage to the job summary
        if: always() && steps.coverage.outcome == 'success'
        env:
          LINE: ${{ steps.coverage.outputs.line }}
          BRANCH: ${{ steps.coverage.outputs.branch }}
        run: |
          {
            echo "## Coverage"
            echo
            echo "| Metric | Coverage |"
            echo "| --- | --- |"
            echo "| Line | ${LINE}% |"
            echo "| Branch | ${BRANCH}% |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: always() && steps.coverage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 14

      # Fork pull requests only get a read only token, so a missing comment
      # must not fail the build.
      - name: Comment coverage on the pull request
        if: always() && github.event_name == 'pull_request' && steps.coverage.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          LINE: ${{ steps.coverage.outputs.line }}
          BRANCH: ${{ steps.coverage.outputs.branch }}
        with:
          script: |
            const marker = '<!-- simplecov-coverage-report -->';
            // context.sha is the ephemeral merge commit on pull_request events.
            const headSha = context.payload.pull_request.head.sha;
            const body = [
              marker,
              '## Coverage',
              '',
              '| Metric | Coverage |',
              '| --- | --- |',
              `| Line | ${process.env.LINE}% |`,
              `| Branch | ${process.env.BRANCH}% |`,
              '',
              `Measured by SimpleCov on \`${headSha.substring(0, 7)}\`. `
                + 'The full HTML report is attached to this run as the '
                + '`coverage-report` artifact.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const previous = comments.find((comment) => comment.body.includes(marker));

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  # The gemspec claims Ruby 3.2, so the oldest supported version is tested too.
  # Coverage is reported by the job above only, so that the two runs do not race
  # each other over the same pull request comment.
  compat:
    name: rspec (ruby 3.2)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run rspec
        run: bundle exec rspec --format progress

  # faraday 1.10 is the oldest release the gemspec allows, and it is still what
  # applications pinned to the older major bring along.
  faraday1:
    name: rspec (faraday 1)
    runs-on: ubuntu-latest

    env:
      BUNDLE_GEMFILE: gemfiles/faraday1.gemfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run rspec
        run: bundle exec rspec --format progress

  rubocop:
    name: Ruby Style Guide
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop
